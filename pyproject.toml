[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scigantic-cards"
version = "0.2.0"
description = "A small data card format and linter for LLM agents: record what differs from the well-known dataset, how big it is, and how to open it."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT-0" }
authors = [{ name = "Scigantic" }]
keywords = ["llm", "agents", "datasets", "data-card", "schema", "lint"]
classifiers = [
  "License :: OSI Approved :: MIT No Attribution License (MIT-0)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "mypy", "jsonschema", "hypothesis"]

[project.scripts]
scigantic-cards = "scigantic_cards.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scigantic_cards = ["py.typed", "card.schema.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
